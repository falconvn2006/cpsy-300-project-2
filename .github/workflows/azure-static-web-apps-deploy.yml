name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master     # If your branch is named 'master', change this to master
    paths:
      - 'frontend/**'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Path Settings ######
          app_location: "/frontend" # Where your Next.js code lives
          api_location: ""          # Leave empty as your backend is separate
          output_location: ".next"  # Next.js default build output
          ###### End of Path Settings ######
