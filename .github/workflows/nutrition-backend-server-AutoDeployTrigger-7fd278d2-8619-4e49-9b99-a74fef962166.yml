name: Trigger auto deployment for nutrition-backend-server

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/nutrition-backend-server-AutoDeployTrigger-7fd278d2-8619-4e49-9b99-a74fef962166.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NUTRITIONBACKENDSERVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NUTRITIONBACKENDSERVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NUTRITIONBACKENDSERVER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: project2.azurecr.io
          registryUsername: ${{ secrets.NUTRITIONBACKENDSERVER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NUTRITIONBACKENDSERVER_REGISTRY_PASSWORD }}
          containerAppName: nutrition-backend-server
          resourceGroup: project-2
          imageToBuild: project2.azurecr.io/nutrition-backend-server:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


